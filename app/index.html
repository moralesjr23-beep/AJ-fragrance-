    <button type="button" class="tab" role="tab" data-tab="create" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3h5M10.5 3v5.5L5 18.2A2 2 0 0 0 6.7 21h10.6a2 2 0 0 0 1.7-2.8L13.5 8.5V3"/><path d="M7.4 15h9.2"/></svg>Atelier</button>
